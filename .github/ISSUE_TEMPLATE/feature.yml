name: Feature request
description: An idea for something Stickies should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Keys, CLI flags and sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
